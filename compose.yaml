services:
  postgres:
    image: postgres:17-alpine
    container_name: pos_jalur_langit_db
    restart: always
    environment:
      POSTGRES_DB: pos_jalur_langit
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: pos_password
      TZ: Asia/Jakarta
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql

volumes:
  postgres_data:
